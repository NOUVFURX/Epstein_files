[package]
name = "locksmith"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "furx-lock"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.4.3"
libc = "0.2.191"
rfd = { version = "0.18.0", default-features = false, features = ["wayland", "xdg-portal"] }
rpassword = "7.5.5"
subtle = "2.6.1"
tempfile = "3.27.0"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
robius-authentication = "0.3.1"
security-framework = "3.7.0"
